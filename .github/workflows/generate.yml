name: Generate repository activity card

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to display (OWNER/REPO)
        required: true
        default: Haruko386/FunPDF
        type: string
      timezone:
        description: IANA time zone used to define yesterday
        required: true
        default: Asia/Shanghai
        type: string
      date:
        description: Optional YYYY-MM-DD override (blank means yesterday)
        required: false
        type: string
      days:
        description: Number of complete days shown in charts (1-15)
        required: true
        default: '15'
        type: string
      theme:
        description: SVG color theme
        required: true
        default: light
        type: choice
        options:
          - light
          - dark
  schedule:
    - cron: '17 0 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: repository-activity-card
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INPUT_REPOSITORY: ${{ inputs.repository || 'Haruko386/FunPDF' }}
      INPUT_TIMEZONE: ${{ inputs.timezone || 'Asia/Shanghai' }}
      INPUT_DATE: ${{ inputs.date || '' }}
      INPUT_DAYS: ${{ inputs.days || '15' }}
      INPUT_THEME: ${{ inputs.theme || 'light' }}
      INPUT_OUTPUT: dist/repository-card.svg
      REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Generate repository card
        run: npm run generate

      - name: Publish output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output-repository-card
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
